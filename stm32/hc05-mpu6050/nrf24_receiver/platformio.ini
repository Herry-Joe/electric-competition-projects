; NRF24L01 接收端 -> 电脑上位机（第二块 BluePill）
[env:bluepill]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

build_flags =
    -DSTM32F103xB
    -DUSE_HAL_DRIVER
    -DHAL_UART_MODULE_ENABLED
    -Wl,-u,_printf_float

extra_scripts =
    pre:extra_script.py

upload_protocol = stlink
monitor_speed = 115200
